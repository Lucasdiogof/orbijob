# TEMPORARIO: diagnostico do agendamento do GitHub Actions. REMOVER DEPOIS (docs/GITHUB_SCHEDULE_DIAGNOSTIC.md).
#
# Pergunta que responde: "este repositorio recebe eventos `schedule`?". O workflow de producao (Jobicy revalidate, cron 17 */6) e o
# monitor (Jobicy watchdog, cron 43 5,17) nao geraram nenhuma execucao agendada, e nao ha causa objetiva conhecida.
#
# O que faz: a cada 15 minutos registra a hora UTC, o tipo do evento, o cron que o disparou e o SHA. So isso.
# O que NAO faz: nenhum segredo, nenhuma variavel, nenhum checkout, nenhuma chamada de rede, nenhum acesso ao Supabase, nenhuma
# alteracao em vagas ou no repositorio (permissoes vazias).
#
# Como ler: aba Actions -> "Diagnostics schedule". Execucoes com evento `schedule` significam que o agendador do GitHub funciona neste
# repositorio; compare a hora de criacao com o minuto do cron (quanto atraso). Sem nenhuma execucao `schedule` apos ~1 hora, o problema
# esta no agendador/registro do repositorio, nao no codigo dos workflows de producao.
name: Diagnostics schedule

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # a cada 15 minutos, fora do minuto 0
  workflow_dispatch:

permissions: {}

concurrency:
  group: diagnostics-schedule
  cancel-in-progress: true

jobs:
  record:
    name: record time, event and sha
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "utc=$now event=$EVENT cron=${CRON:-none} sha=$SHA ref=$REF run=$RUN_ID"
          {
            echo "### Diagnostics schedule"
            echo "- UTC: \`$now\`"
            echo "- evento: \`$EVENT\`"
            echo "- cron que disparou: \`${CRON:-nenhum (execucao manual)}\`"
            echo "- sha: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
