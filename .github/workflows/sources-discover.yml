# Descoberta incremental das fontes de vagas alem do Jobicy (Arbeitnow, Remote OK, Remotive, Platsbanken, Taiwan Jobs, Jobs.co.nz), 100% gratuita (repositorio publico + runner padrao).
#
# O QUE FAZ: le o feed oficial da fonte e INSERE somente as vagas que ainda nao estao no banco; as que o feed ainda lista e ja estao gravadas (abertas)
# so tem a data de verificacao renovada (essas fontes nao tem endpoint de status: estar no feed e a prova de que a vaga segue aberta). NAO atualiza
# conteudo, NAO fecha, NAO reabre, NAO apaga, NAO toca em can_redistribute nem em dados de usuario. Fechar o que sumiu do feed e trabalho do Supabase
# Cron (ops.expire_unseen_jobs). O modo e fixo no script (worker/scripts/discover-local.mjs usa SYNC_MODE=discover).
#
# ESTA DESLIGADO POR PADRAO:
#   * o agendamento so executa quando a variavel de repositorio SOURCES_DISCOVERY_ENABLED vale 'true';
#   * a execucao manual so importa com action=discover E confirm=IMPORTAR-NOVAS-VAGAS; os padroes (check, preview) nao gravam nada.
# Cada fonte tem a SUA lease (uma passada por hora por fonte), independente da do Jobicy e da revalidacao.
#
# Ritmos (respeitam o que cada fonte diz): Arbeitnow 4x/dia (paginas lentas: o Cloudflare deles desafia rajadas; no primeiro desafio a passada para);
# Remote OK 2x/dia; Remotive 1x/dia (README: no maximo 4 consultas por dia, vagas atrasadas 24 h);
# Platsbanken (jobtech, Arbetsformedlingen, CC0, sem chave) 4x/dia, 1 requisicao por segundo, ~25 paginas por passada.
# Credencial: UM segredo, ORBIJOB_SYNC_WORKER_KEY, no ENVIRONMENT "jobicy-revalidation" (restrito a main), entregue so aos passos que o usam.
name: Sources discover

on:
  schedule:
    - cron: '23 2,8,14,20 * * *'
    - cron: '41 5,17 * * *'
    - cron: '53 6 * * *'
    - cron: '31 3,9,15,21 * * *'
    # segunda serie, deslocada: o GitHub descarta agendamentos (12/10: Arbeitnow 08:23 e 14:23 e Platsbanken 09:31 e 15:31 nunca iniciaram). A lease do banco
    # faz a repeticao ser inofensiva (uma passada por hora por fonte; se a passada anterior foi ha menos de 1 h, a nova recua com too_soon).
    - cron: '37 5,11,17,23 * * *'
    - cron: '13 0,6,12,18 * * *'
    - cron: '27 8,20 * * *'
    - cron: '51 10,22 * * *'
    - cron: '43 1,19 * * *'
    - cron: '16 7 * * *'
    - cron: '5 3,9,15,21 * * *'
    # Get on Board (LatAm tech, public API): twice a day, one polite request every two seconds; the second series is the displaced twin
    - cron: '16 4,16 * * *'
    - cron: '16 10,22 * * *'
    # Teaching Vacancies (England, Open Government Licence): the whole feed (~70 pages at one request every 1.5 s) four times a day, plus a displaced twin
    - cron: '59 1,7,13,19 * * *'
    - cron: '31 4,10,16,22 * * *'
    # NYC Jobs (NYC Open Data, refreshed daily): twice a day plus a displaced twin; 3 pages of 500
    - cron: '35 6,18 * * *'
    - cron: '59 12 * * *'
    # Karriere.NRW (Open.NRW, dl-by-de/2.0): one 6.5 MB request per pass, twice a day plus a displaced twin
    - cron: '12 5,17 * * *'
    - cron: '14 11,23 * * *'
    # Groupe BPCE (employer open data, Licence Ouverte 2.0; the portal refreshes 4 times a day): 18 requests per pass, twice a day plus a displaced twin
    - cron: '30 7,19 * * *'
    - cron: '28 13 * * *'
    # Le Forem (Wallonia, CC BY-SA 4.0): the 2,500 newest offers, 25 requests at 1.5 s, twice a day plus a displaced twin
    - cron: '46 8,20 * * *'
    - cron: '43 14 * * *'
    # Úřad práce ČR / MPSV (Czech open data, refreshed daily ~01:07 UTC): one ~190 MB file streamed in ~10 s, the 3,000 most recently inserted; twice a day
    - cron: '43 13 * * *'
    - cron: '8 19 * * *'
    - cron: '34 2,8,14,20 * * *'
    # SEF Murcia (Spanish regional employment service open data): one small JSON read, 4 times a day
    - cron: '18 3,9,15,21 * * *'
    # City of Calgary (open data, ≈ 55 listings): one small JSON read a day
    - cron: '40 9 * * *'
    # SINE-ES (Espírito Santo, Brazil: open data of the state employment agencies, rewritten every morning): a catalogue read and 11 small CSVs, once a day
    - cron: '20 9 * * *'
    # Feina Activa (Catalonia, SOC open data): one ~7 MB XML read, 4 times a day
    - cron: '2 4,10,16,22 * * *'
    # ECYL (Castilla y León employment service open data): one ~1.2 MB JSON read, twice a day
    - cron: '36 0,12 * * *'
    # Lanbide (Basque employment service open data): one ~600 KB JSON read, twice a day
    - cron: '13 1,13 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Fonte a ler'
        type: choice
        options: [arbeitnow, remoteok, remotive, jobtech, twjobs, jobsconz, getonboard, teachingvacancies, nycjobs, karrierenrw, bpce, forem, mpsvcz, csp, sefmurcia, feinaactiva, ecyl, lanbide, calgary, sinees]
        default: arbeitnow
      action:
        description: 'check = somente leitura; preview = SIMULACAO (le o feed, nao grava nada); discover = UMA importacao real'
        type: choice
        options: [check, preview, discover]
        default: check
      confirm:
        description: 'Para action=discover digite exatamente: IMPORTAR-NOVAS-VAGAS'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: sources-discover
  cancel-in-progress: false

jobs:
  discover:
    name: discover new jobs only
    # agendado: so com a chave de liga/desliga; manual: sempre permitido (o padrao dele e somente leitura)
    if: github.event_name == 'workflow_dispatch' || vars.SOURCES_DISCOVERY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: jobicy-revalidation
    defaults:
      run:
        working-directory: worker
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install dependencies (reproducible, no install scripts)
        run: npm ci --ignore-scripts

      - name: Choose the source
        id: src
        env:
          SCHEDULE: ${{ github.event.schedule }}
          CHOSEN: ${{ inputs.source }}
        run: |
          case "$SCHEDULE" in
            '23 2,8,14,20 * * *') s=arbeitnow ;;
            '41 5,17 * * *')      s=remoteok ;;
            '53 6 * * *')         s=remotive ;;
            '31 3,9,15,21 * * *') s=jobtech ;;
            '37 5,11,17,23 * * *') s=arbeitnow ;;
            '13 0,6,12,18 * * *') s=jobtech ;;
            '27 8,20 * * *')      s=remoteok ;;
            '51 10,22 * * *')     s=remotive ;;
            '43 1,19 * * *')      s=twjobs ;;
            '16 7 * * *')         s=twjobs ;;
            '5 3,9,15,21 * * *')  s=jobsconz ;;
            '16 4,16 * * *')      s=getonboard ;;
            '16 10,22 * * *')      s=getonboard ;;
            '59 1,7,13,19 * * *') s=teachingvacancies ;;
            '31 4,10,16,22 * * *') s=teachingvacancies ;;
            '35 6,18 * * *')      s=nycjobs ;;
            '59 12 * * *')        s=nycjobs ;;
            '12 5,17 * * *')      s=karrierenrw ;;
            '14 11,23 * * *')      s=karrierenrw ;;
            '30 7,19 * * *')      s=bpce ;;
            '28 13 * * *')         s=bpce ;;
            '46 8,20 * * *')      s=forem ;;
            '43 14 * * *')         s=forem ;;
            '43 13 * * *')         s=mpsvcz ;;
            '8 19 * * *')          s=mpsvcz ;;
            '34 2,8,14,20 * * *')  s=csp ;;
            '18 3,9,15,21 * * *')  s=sefmurcia ;;
            '2 4,10,16,22 * * *')  s=feinaactiva ;;
            '36 0,12 * * *')       s=ecyl ;;
            '13 1,13 * * *')       s=lanbide ;;
            '40 9 * * *')          s=calgary ;;
            '20 9 * * *')          s=sinees ;;
            *)                    s="$CHOSEN" ;;
          esac
          case "$s" in arbeitnow|remoteok|remotive|jobtech|twjobs|jobsconz|getonboard|teachingvacancies|nycjobs|karrierenrw|bpce|forem|mpsvcz|csp|sefmurcia|feinaactiva|ecyl|lanbide|calgary|sinees) ;; *) echo "::error title=Fonte invalida::fonte nao reconhecida"; exit 1 ;; esac
          echo "source=$s" >> "$GITHUB_OUTPUT"
          echo "fonte: $s"

      - name: Check that the secret exists
        id: sec
        env:
          KEY: ${{ secrets.ORBIJOB_SYNC_WORKER_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "missing=1" >> "$GITHUB_OUTPUT"
            echo "::error title=Segredo ausente::ORBIJOB_SYNC_WORKER_KEY nao esta definido no environment jobicy-revalidation"
            exit 4
          fi
          echo "::add-mask::$KEY"

      - name: Check the key (read-only)
        id: kc
        env:
          ORBIJOB_WORKER_KEY: ${{ secrets.ORBIJOB_SYNC_WORKER_KEY }}
        run: |
          code=0
          node scripts/worker-key-check.mjs || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Pre-flight (read-only)
        env:
          ORBIJOB_SUPABASE_SECRET: ${{ secrets.ORBIJOB_SYNC_WORKER_KEY }}
          ORBIJOB_SOURCE: ${{ steps.src.outputs.source }}
        run: node scripts/discover-local.mjs preflight

      - name: 'Preview (simulation - reads the feed, writes nothing)'
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'preview'
        env:
          ORBIJOB_SUPABASE_SECRET: ${{ secrets.ORBIJOB_SYNC_WORKER_KEY }}
          ORBIJOB_SOURCE: ${{ steps.src.outputs.source }}
        run: |
          node scripts/discover-local.mjs preview | tee preview.log
          {
            echo "### Sources discover (simulacao)"
            grep -E '^(preflight|simulacao|metricas)' preview.log | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Discover (new jobs only; no update, no close, no delete)
        id: rv
        if: github.event_name == 'schedule' || (inputs.action == 'discover' && inputs.confirm == 'IMPORTAR-NOVAS-VAGAS')
        env:
          ORBIJOB_SUPABASE_SECRET: ${{ secrets.ORBIJOB_SYNC_WORKER_KEY }}
          ORBIJOB_SOURCE: ${{ steps.src.outputs.source }}
        run: |
          code=0
          node scripts/discover-local.mjs run --yes > run.log 2>&1 || code=$?
          cat run.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          state=$(grep -oE '^estado: [A-Z_]+' run.log | tail -n 1 | cut -d' ' -f2)
          echo "state=${state:-FAILED}" >> "$GITHUB_OUTPUT"
          {
            echo "### Sources discover"
            grep -E '^(preflight|resultado|metricas|verificacao|estado|codigo de saida)' run.log | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: 'ALERT auth: Supabase refused the credential'
        if: always() && (steps.sec.outputs.missing == '1' || (steps.kc.outputs.code != '' && steps.kc.outputs.code != '0') || steps.rv.outputs.code == '4')
        run: echo "::error title=sources-auth::O Supabase recusou a credencial da automacao"
      - name: 'ALERT unreachable: database did not answer'
        if: always() && steps.rv.outputs.code == '5'
        run: echo "::error title=sources-unreachable::O banco nao respondeu"
      # Planned limit, not a fault: a healthy pass (feed read, no HTTP error, verification passed) that stopped only at the source's catalogue ceiling.
      # The run stays green; this notice and the summary say so. Real failures in the same pass are classified FAILED/PARTIAL and raise their own ALERT.
      - name: 'CAPACITY: source at its planned catalogue ceiling (healthy, not a failure)'
        if: always() && steps.rv.outputs.state == 'AT_CAPACITY'
        run: echo "::notice title=sources-at-capacity::A fonte esta no teto planejado do catalogo; a passada leu o feed sem erro. Nada novo entra ate vagas expirarem (revalidacao e expiracao seguem normais)"
      - name: 'ALERT api: source feed errors (nothing existing was changed)'
        if: always() && steps.rv.outputs.code == '6'
        run: echo "::error title=sources-api::O feed da fonte falhou em parte da passada (ou bloqueou com desafio anti-bot, que nao e contornado)"
