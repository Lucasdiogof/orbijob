name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: worker/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test        # includes occupation resolver + RLS tests (PGlite)
      - name: Worker configuration and bundle (wrangler dry run, nothing is deployed and no account is needed)
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-bundle
        env: { WRANGLER_SEND_METRICS: 'false', CI: '1' }
      - name: The Worker running in the real Cloudflare runtime (workerd, local), against an in-memory Supabase and Jobicy
        run: node scripts/e2e-workerd.mjs
        env: { WRANGLER_SEND_METRICS: 'false', CI: '1' }
      - name: The setting pinned in wrangler.toml (production) revalidates and imports nothing, in workerd
        run: node scripts/e2e-workerd.mjs
        env: { WRANGLER_SEND_METRICS: 'false', CI: '1', E2E_MODE: pinned }
  worker-postgrest:
    # The Worker's WRITE path (SupabaseJobStore + runSync + the service_role grants of migration 6) against a REAL PostgREST
    # on the REAL migrated schema, with a real signed JWT. Throw-away database; no Supabase project is involved.
    name: worker-postgrest (PostgREST ${{ matrix.pgrst }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pgrst: [v14.18, v16.4]
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: worker/package-lock.json }
      - name: Schema (platform stub + every migration)
        run: |
          base=postgres://postgres:postgres@localhost:5432
          psql "$base/postgres" -v ON_ERROR_STOP=1 -qc "create database worker_contract"
          url="$base/worker_contract"
          psql "$url" -v ON_ERROR_STOP=1 -q -f supabase/tests/00_platform_stub.sql
          for m in supabase/migrations/*.sql; do psql "$url" -v ON_ERROR_STOP=1 -q -f "$m" >/dev/null; done
          psql "$url" -v ON_ERROR_STOP=1 -q -c "create role authenticator login noinherit password 'authpw'; grant anon, authenticated, service_role to authenticator;"
      - name: Start PostgREST ${{ matrix.pgrst }} with a JWT secret
        run: |
          echo "PGRST_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          curl -fsSL "https://github.com/PostgREST/postgrest/releases/download/${{ matrix.pgrst }}/postgrest-${{ matrix.pgrst }}-linux-static-x86-64.tar.xz" | tar xJ
          export PGRST_JWT_SECRET="$(grep ^PGRST_JWT_SECRET "$GITHUB_ENV" | cut -d= -f2)"
          export PGRST_DB_URI="postgres://authenticator:authpw@localhost:5432/worker_contract"
          export PGRST_DB_SCHEMAS=public PGRST_DB_ANON_ROLE=anon PGRST_SERVER_PORT=3000
          nohup ./postgrest > postgrest.log 2>&1 &
          for i in $(seq 1 40); do curl -sf "http://localhost:3000/jobs?limit=1" >/dev/null && exit 0; sleep 1; done
          echo "PostgREST did not start"; cat postgrest.log; exit 1
      - run: npm ci
        working-directory: worker
      - name: Ingestion write path against PostgREST
        working-directory: worker
        env:
          POSTGREST_URL: http://localhost:3000
          POSTGREST_JWT_SECRET: ${{ env.PGRST_JWT_SECRET }}
        run: npx vitest run test/live/postgrest.contract.test.ts test/live/lease-stress.test.ts --no-file-parallelism --reporter=default --reporter=json --outputFile.json=vitest-contract.json
      - name: The Worker in workerd writing to the real database through PostgREST
        working-directory: worker
        env:
          WRANGLER_SEND_METRICS: 'false'
          CI: '1'
          POSTGREST_URL: http://localhost:3000
          E2E_JWT_SECRET: ${{ env.PGRST_JWT_SECRET }}
        run: |
          # the contract test above leaves its own rows (fixed clocks); this run starts from an empty catalogue and ledger
          psql "postgres://postgres:postgres@localhost:5432/worker_contract" -v ON_ERROR_STOP=1 -q -c "delete from public.sync_runs; delete from public.jobs;"
          node scripts/e2e-workerd.mjs
      - name: Test failures and the lease measurement as annotations (readable without opening the log)
        if: always()
        working-directory: worker
        run: node scripts/ci-annotate-vitest.mjs vitest-contract.json lease-stress.json
      - name: PostgREST log
        if: failure()
        run: cat postgrest.log
  supabase-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: State classifier and remote end-to-end script (against in-memory models, no network)
        run: node --test scripts/supabase/*.test.mjs
      - name: Gating logic of apply.sh (fake CLI binaries)
        run: scripts/supabase/apply.test.sh
  supabase-sql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17]   # the hosted project runs 17; 16 is kept until 17 has been green for a while
    name: supabase-sql (postgres ${{ matrix.pg }})
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Migrations + catalog audit + cross-user tests (disposable Postgres, no Supabase project involved)
        run: PGURL=postgres://postgres:postgres@localhost:5432/postgres supabase/tests/run.sh
  catalog-postgrest:
    # A mocked client proves what the app SENDS; this proves a REAL PostgREST accepts it on the REAL migrated schema and
    # answers with the right rows and JSON types. Replays app/test/supabase/catalog_requests.golden.json (generated by
    # the Flutter repository itself) against a throw-away database. No Supabase project is involved.
    name: catalog-postgrest (PostgREST ${{ matrix.pgrst }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pgrst: [v14.18, v16.4]   # the hosted PostgREST version is not readable with the publishable key; test two current ones
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Schema (platform stub + every migration) and seed
        run: |
          base=postgres://postgres:postgres@localhost:5432
          psql "$base/postgres" -v ON_ERROR_STOP=1 -qc "create database catalog_contract"
          url="$base/catalog_contract"
          psql "$url" -v ON_ERROR_STOP=1 -q -f supabase/tests/00_platform_stub.sql
          for m in supabase/migrations/*.sql; do psql "$url" -v ON_ERROR_STOP=1 -q -f "$m" >/dev/null; done
          psql "$url" -v ON_ERROR_STOP=1 -q -c "create role authenticator login noinherit password 'authpw'; grant anon, authenticated, service_role to authenticator;"
          psql "$url" -v ON_ERROR_STOP=1 -q -f supabase/tests/09_catalog_seed.sql
      - name: Start PostgREST ${{ matrix.pgrst }}
        run: |
          curl -fsSL "https://github.com/PostgREST/postgrest/releases/download/${{ matrix.pgrst }}/postgrest-${{ matrix.pgrst }}-linux-static-x86-64.tar.xz" | tar xJ
          export PGRST_DB_URI="postgres://authenticator:authpw@localhost:5432/catalog_contract"
          export PGRST_DB_SCHEMAS=public PGRST_DB_ANON_ROLE=anon PGRST_SERVER_PORT=3000
          nohup ./postgrest > postgrest.log 2>&1 &
          for i in $(seq 1 40); do curl -sf "http://localhost:3000/jobs?limit=1" >/dev/null && exit 0; sleep 1; done
          echo "PostgREST did not start"; cat postgrest.log; exit 1
      - name: Replay the app's catalogue requests
        run: POSTGREST_URL=http://localhost:3000 node scripts/supabase/catalog_postgrest_contract.mjs
      - name: PostgREST log
        if: failure()
        run: cat postgrest.log
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build-coverage.mjs
      - name: Generated files must be committed
        run: git diff --exit-code data/coverage-matrix.csv docs/COVERAGE_MATRIX.md
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Build web (production entrypoint, bundled CanvasKit)
        run: flutter build web --release --no-web-resources-cdn
  android-resources:
    # Resource-level check of launcher/adaptive/monochrome/splash with the real aapt2. It does not build an APK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y aapt libandroid-23-java
      - run: bash docs/design/identity/build/validate_android.sh
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --no-banner
