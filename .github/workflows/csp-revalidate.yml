# Revalidacao das ofertas ja gravadas do Choisir le Service Public (fonte csp, Franca), 100% gratuita (repositorio publico + runner padrao do GitHub).
#
# POR QUE EXISTE: o arquivo aberto da fonte (data.gouv.fr, semanal) fica uma semana ou mais atras do site e mantem a oferta ate o fim padrao da
# publicacao; em 14/10 um terco das ofertas ainda "no prazo" ja estava retirada. Por isso nenhuma oferta e provada aberta pelo arquivo: cada uma e
# perguntada na sua propria pagina (titulo "Offre depubliee" = encerrada; o titulo da oferta = publicada), da menos recentemente verificada para a mais
# recente, em lotes de 25 paginas (1 por segundo), ate o orcamento de 9 minutos (~450 por passada, 4 passadas por dia cobrem as 2.000 do teto antes das 72 h
# em que o app esconde uma vaga sem verificacao).
#
# O QUE FAZ: renova last_checked_at SO das que a pagina confirma publicadas e fecha SO as que a pagina confirma retiradas. 404, 429, 5xx, timeout e
# pagina irreconhecivel NAO fecham nem confirmam nada. NAO importa vaga, NAO apaga, NAO toca em can_redistribute nem em dados de usuario.
#
# Lease: por (fonte, hora). A descoberta desta fonte roda as 02/08/14/20:34 UTC; esta revalidacao as 05/11/17/23:07 (horas diferentes).
# Liga junto com a revalidacao das fontes: o agendamento so executa quando SOURCES_REVALIDATION_ENABLED vale 'true'.
# Credencial: UM segredo, ORBIJOB_SYNC_WORKER_KEY, no ENVIRONMENT "jobicy-revalidation" (restrito a main), entregue so aos passos que o usam.
name: CSP revalidate

on:
  schedule:
    - cron: '7 5,11,17,23 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'check = somente leitura (valida a chave e a pre-checagem); revalidate = UMA revalidacao real do Choisir le Service Public'
        type: choice
        options: [check, revalidate]
        default: check

permissions:
  contents: read

concurrency:
  group: csp-revalidate
  cancel-in-progress: false

jobs:
  revalidate:
    name: revalidate stored Choisir le Service Public offers only
    # agendado: so com a chave de liga/desliga; manual: sempre permitido (o padrao dele e somente leitura)
    if: github.event_name == 'workflow_dispatch' || vars.SOURCES_REVALIDATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    environment: jobicy-revalidation
    env:
      ORBIJOB_SOURCE: csp
    defaults:
      run:
        working-directory: worker
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install dependencies (reproducible, no install scripts)
        run: npm ci --ignore-scripts

      - name: Check that the secret exists
        id: sec
        env:
          KEY: ${{ secrets.ORBIJOB_SYNC_WORKER_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "missing=1" >> "$GITHUB_OUTPUT"
            echo "::error title=Segredo ausente::ORBIJOB_SYNC_WORKER_KEY nao esta definido no environment jobicy-revalidation"
            exit 4
          fi
          echo "::add-mask::$KEY"

      - name: Check the key (read-only)
        id: kc
        env:
          ORBIJOB_WORKER_KEY: ${{ secrets.ORBIJOB_SYNC_WORKER_KEY }}
        run: |
          code=0
          node scripts/worker-key-check.mjs || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Pre-flight (read-only)
        env:
          ORBIJOB_SUPABASE_SECRET: ${{ secrets.ORBIJOB_SYNC_WORKER_KEY }}
        run: node scripts/revalidate-local.mjs preflight

      - name: Revalidate (stored jobs only; no import, no delete)
        id: rv
        if: github.event_name == 'schedule' || inputs.action == 'revalidate'
        env:
          ORBIJOB_SUPABASE_SECRET: ${{ secrets.ORBIJOB_SYNC_WORKER_KEY }}
          ORBIJOB_BUDGET_MIN: '9'
        run: |
          code=0
          node scripts/revalidate-local.mjs run --yes > run.log 2>&1 || code=$?
          cat run.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "### CSP revalidate"
            grep -E '^(preflight|resultado|verificacao|codigo de saida)' run.log | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      # Marcadores lidos pelo monitor: o passo roda so no caso indicado e termina com sucesso.
      - name: 'ALERT auth: Supabase refused the credential'
        if: always() && (steps.sec.outputs.missing == '1' || (steps.kc.outputs.code != '' && steps.kc.outputs.code != '0') || steps.rv.outputs.code == '4')
        run: echo "::error title=sources-auth::O Supabase recusou a credencial da automacao"
      - name: 'ALERT unreachable: database did not answer'
        if: always() && steps.rv.outputs.code == '5'
        run: echo "::error title=sources-unreachable::O banco nao respondeu"
      - name: 'ALERT api: offer pages failed (nothing was closed because of them)'
        if: always() && steps.rv.outputs.code == '6'
        run: echo "::error title=sources-api::As paginas das ofertas do Choisir le Service Public falharam em parte da passada (ou o tempo acabou); nada foi fechado por causa disso"
