# TEMPORARY read-only probe (OrbiJob 13.0 research): fetches the first bytes of a public feed from a GitHub runner, because some hosts are not reachable
# from the owner's machine. Prints status, content type and the first bytes, then repeats the request with Node's own fetch (what the connectors use),
# decodes and parses it, and prints what went wrong, if anything. Writes nothing anywhere. Removed after the research.
name: Probe feed
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'https URL of a public open-data feed'
        type: string
        required: true
      bytes:
        description: 'how many bytes to print'
        type: string
        default: '9000'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Fetch the first bytes
        env:
          URL: ${{ inputs.url }}
          BYTES: ${{ inputs.bytes }}
        run: |
          case "$URL" in https://*) ;; *) echo "only https"; exit 1 ;; esac
          curl -sS -L --max-time 90 -A 'OrbiJob/1 (+https://github.com/Lucasdiogof/orbijob; research probe)' -D /tmp/h -o /tmp/b -w 'status=%{http_code} size=%{size_download} type=%{content_type}\n' "$URL" || true
          head -c 600 /tmp/h || true
          echo '----'
          head -c ${BYTES:-9000} /tmp/b | tr -d '\000' || true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Node fetch, decode and parse
        env:
          URL: ${{ inputs.url }}
        run: |
          node <<'JS'
          (async () => {
            try {
              const r = await fetch(process.env.URL, { headers: { Accept: 'application/json', 'User-Agent': 'OrbiJob/1 (+https://github.com/Lucasdiogof/orbijob; job catalogue with attribution and original links)' }, signal: AbortSignal.timeout(60000) });
              console.log('node status', r.status, r.headers.get('content-type'));
              const b = await r.arrayBuffer();
              console.log('node bytes', b.byteLength);
              let text;
              try { text = new TextDecoder('utf-8', { fatal: true }).decode(b); console.log('utf8 ok'); }
              catch (e) { console.log('utf8 invalid:', e.message); text = new TextDecoder('iso-8859-1').decode(b); console.log('latin1 ok'); }
              try { const j = JSON.parse(text); console.log('json ok', Array.isArray(j), j.length); }
              catch (e) {
                console.log('json error:', e.message);
                const m = /position (\d+)/.exec(e.message);
                if (m) console.log('around:', JSON.stringify(text.slice(Math.max(0, +m[1] - 80), +m[1] + 80)));
              }
            } catch (e) { console.log('node error:', e && e.message, '| cause:', e && e.cause && (e.cause.code || e.cause.message)); }
          })();
          JS
