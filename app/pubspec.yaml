name: orbijob
description: "OrbiJob by Lucksrei - global job search, compatibility ranking and application tracking."
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: '>=3.13.0-0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.0.0
  flutter_svg: ^2.0.17
  cupertino_icons: ^2.0.0
  supabase_flutter: ^2.18.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  file_picker: ^13.1.0
  url_launcher: ^6.3.3
  archive: ^4.5.1
  webview_flutter: ^4.14.1
  share_plus: ^13.3.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.26.2
  google_mlkit_translation: ^1.0.3
  shared_preferences: ^2.5.6
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  connectivity_plus: ^7.3.2

  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/fonts/OFL-SpaceGrotesk.txt
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-JetBrainsMono.txt

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
